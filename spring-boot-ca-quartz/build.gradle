plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':quartz')
    
    implementation "org.springframework.boot:spring-boot-starter-quartz:3.4.1"
    implementation "org.springframework.boot:spring-boot-autoconfigure:3.4.1"
    
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:3.4.1"
    
    testImplementation "org.springframework.boot:spring-boot-starter-test:3.4.1"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

test {
    useJUnitPlatform()
}