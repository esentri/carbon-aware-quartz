spring.application.name=carbon-aware-quartz-demo
spring.main.web-application-type=NONE

# Carbon-Aware Scheduling Configuration (new starter properties)
carbon.aware.scheduling.enabled=true
carbon.aware.scheduling.dry-run=false
carbon.aware.scheduling.statistics.enabled=true
carbon.aware.scheduling.open-data.enabled=true
carbon.aware.scheduling.open-data.locations=de,ch

# Use custom persistence client (Spring bean will be auto-detected)
# carbon.aware.scheduling.persistence.bean-name=carbonStatisticsClient

# Use custom forecast client (comment out to use default OpenData provider)
# carbon.aware.scheduling.forecast.bean-name=carbonForecastClient

## Spring Quartz with POSTGRES Configuration (usage for grafana dashboards)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=false

spring.datasource.url=jdbc:postgresql://localhost:5444/carbon
spring.datasource.username=carbon
spring.datasource.password=carbon
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.platform=postgres

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.jdbc.platform=postgres
spring.quartz.jdbc.schema=classpath:quartz/jobstore/postgres-schema.sql
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

