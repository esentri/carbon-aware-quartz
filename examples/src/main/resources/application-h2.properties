spring.application.name=carbon-aware-quartz-demo
spring.main.web-application-type=NONE

# Carbon-Aware Scheduling Configuration (new starter properties)
carbon.aware.scheduling.enabled=true
carbon.aware.scheduling.dry-run=false
carbon.aware.scheduling.statistics.enabled=true
carbon.aware.scheduling.open-data.enabled=true
carbon.aware.scheduling.open-data.locations=de

# Use custom persistence client (Spring bean will be auto-detected)
# carbon.aware.scheduling.persistence.bean-name=carbonStatisticsClient

# Use custom forecast client (comment out to use default OpenData provider)
# carbon.aware.scheduling.forecast.bean-name=carbonForecastClient

## Spring Quartz in Memory DATASOURCE
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.generate-ddl=true

spring.datasource.url=jdbc:h2:file:./carbon-aware-quartz-db
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.platform=h2

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.jdbc.platform=h2
spring.quartz.jdbc.schema=classpath:quartz/jobstore/h2-schema.sql
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate